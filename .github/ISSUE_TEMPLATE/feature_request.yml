name: 功能建议
description: 提出可复用的新功能或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景，而不是只写实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的体验
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的其他方案
