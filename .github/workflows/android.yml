name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Wardrobe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 托管 runner 已带 Android SDK 与 cmdline-tools，无需安装旧版 "tools" 包。
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain -Porg.gradle.java.installations.auto-download=false

      - name: Lint
        run: ./gradlew lintDebug --console=plain -Porg.gradle.java.installations.auto-download=false

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain -Porg.gradle.java.installations.auto-download=false

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-wardrobe-debug
          path: Wardrobe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
